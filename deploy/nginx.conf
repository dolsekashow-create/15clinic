# Reverse proxy for a self-hosted deployment.
# The Node process listens on 127.0.0.1:3000 and is never exposed directly.

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    server_name app.example.com;
    # Everything goes to HTTPS. No exceptions.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Do not advertise the server version to an attacker.
    server_tokens off;

    client_max_body_size 20m;   # medical file uploads
    client_body_timeout 30s;

    # Brute-force protection on the login exchange. This is the rate limiting
    # the application layer still lacks — running it at the edge is both
    # cheaper and harder to bypass.
    location = /api/v1/auth/session {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    access_log /var/log/nginx/clinic.access.log;
    error_log  /var/log/nginx/clinic.error.log warn;
}
