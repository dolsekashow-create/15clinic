name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# No secrets are needed for CI. Nothing here touches a real Firebase project.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Catches a secret committed by accident BEFORE it reaches main.
      - name: Check for committed env files
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::An .env file is tracked in git. Remove it and rotate the credentials."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders only. Real values live in the host's
          # environment, never in the repository or in CI for a public build.
          NEXT_PUBLIC_FIREBASE_API_KEY: build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: build-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: build-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: build-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: build-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: build-placeholder
